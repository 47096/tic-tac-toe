<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>過三關 — Tic Tac Toe</title>

    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --bg: #fafafa;
            --surface: #f0f0f0;
            --text: #1a1a1a;
            --text-dim: #bbb;
            --border: #e0e0e0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Helvetica Neue', 'Arial', sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh; width: 100vw;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            overflow: hidden;
            -webkit-user-select: none; user-select: none;
        }

        .screen { display: flex; flex-direction: column; align-items: center; gap: 14px; width: 100%; max-width: 400px; padding: 16px; }
        .screen.hidden { display: none; }

        h1 { font-size: 1.1rem; font-weight: 300; letter-spacing: 0.3em; text-transform: uppercase; }
        .sub { font-size: 0.6rem; color: var(--text-dim); letter-spacing: 0.15em; }

        /* Picker */
        .pick-section { width: 100%; }
        .pick-header { font-size: 0.7rem; color: var(--text-dim); letter-spacing: 0.1em; margin-bottom: 6px; text-align: center; }
        .pick-header.active { color: var(--text); font-weight: 600; }
        .emoji-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 5px; margin-bottom: 10px; width: 100%; max-width: 340px; }
        .emoji-grid .e { width: 100%; aspect-ratio: 1; font-size: 1.3rem; border: 1px solid var(--border); background: var(--bg); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.15s; }
        .emoji-grid .e:hover { border-color: var(--text-dim); }
        .emoji-grid .e.sel { border-color: var(--text); background: var(--surface); }
        .emoji-grid .e.used { opacity: 0.2; pointer-events: none; }

        .pick-preview { display: flex; gap: 16px; align-items: center; justify-content: center; margin-bottom: 8px; }
        .pick-card { text-align: center; }
        .pick-card .label { font-size: 0.55rem; color: var(--text-dim); letter-spacing: 0.1em; margin-bottom: 3px; }
        .pick-card .box { width: 44px; height: 44px; border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 1.4rem; background: var(--surface); }
        .pick-card .box.filled { border-color: var(--text); }
        .pick-card .box.empty { border-style: dashed; color: var(--text-dim); font-size: 1rem; }

        .btn-row { display: flex; gap: 8px; margin-top: 4px; }
        .btn { padding: 10px 24px; border: 1px solid var(--text); background: transparent; color: var(--text); font-size: 0.8rem; font-weight: 600; cursor: pointer; letter-spacing: 0.1em; transition: all 0.15s; }
        .btn:hover { background: var(--text); color: var(--bg); }
        .btn:disabled { opacity: 0.25; cursor: default; background: transparent; color: var(--text-dim); border-color: var(--border); }
        .btn-sm { padding: 6px 14px; font-size: 0.65rem; }

        .online-link { font-size: 0.65rem; color: var(--text-dim); cursor: pointer; letter-spacing: 0.05em; margin-top: 6px; }
        .online-link:hover { color: var(--text); }

        .snap-btn { display: flex; align-items: center; gap: 4px; padding: 6px 12px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--text-dim); font-size: 0.6rem; cursor: pointer; letter-spacing: 0.05em; margin-top: 2px; }
        .snap-btn:hover { border-color: var(--text-dim); color: var(--text); }

        .camera-preview { width: 160px; height: 160px; border-radius: 8px; border: 1px solid var(--border); overflow: hidden; display: none; margin-bottom: 6px; }
        .camera-preview video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        .camera-preview .cam-label { position: absolute; top: 4px; left: 4px; font-size: 0.5rem; padding: 2px 6px; background: rgba(0,0,0,0.5); color: #fff; border-radius: 3px; }

        .snap-hidden { position: absolute; left: -9999px; top: -9999px; width: 320px; height: 320px; opacity: 0; pointer-events: none; }

        /* Online */
        .online-tabs { display: flex; gap: 2px; padding: 2px; border-radius: 6px; background: var(--surface); margin-bottom: 10px; }
        .online-tabs button { padding: 6px 14px; border: none; border-radius: 5px; background: transparent; color: var(--text-dim); font-size: 0.65rem; font-weight: 600; cursor: pointer; }
        .online-tabs button.active { background: var(--bg); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,0.05); }

        .room-box { padding: 14px; border: 1px solid var(--border); border-radius: 8px; text-align: center; width: 100%; max-width: 260px; }
        .room-code { font-size: 1.6rem; font-weight: 300; letter-spacing: 0.3em; margin: 4px 0; }
        .share-url { padding: 5px 8px; border: 1px solid var(--border); border-radius: 5px; font-size: 0.6rem; color: var(--text-dim); word-break: break-all; background: var(--surface); cursor: pointer; display: block; }
        .waiting { display: flex; align-items: center; gap: 6px; font-size: 0.7rem; color: var(--text-dim); margin-top: 8px; }
        .spinner { width: 12px; height: 12px; border: 1.5px solid var(--border); border-top-color: var(--text); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .join-input { display: flex; gap: 6px; width: 100%; max-width: 220px; }
        .join-input input { flex: 1; padding: 8px 12px; border: 1px solid var(--border); border-radius: 5px; font-size: 0.9rem; font-weight: 300; text-align: center; letter-spacing: 0.15em; text-transform: uppercase; outline: none; background: var(--bg); color: var(--text); }
        .join-input input:focus { border-color: var(--text); }

        .error-msg { color: #c00; font-size: 0.65rem; text-align: center; }

        /* Game */
        .info-bar { display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 4px 0; }
        .turn-badge { font-size: 0.75rem; padding: 4px 10px; border: 1px solid var(--border); border-radius: 12px; display: flex; align-items: center; gap: 5px; }
        .turn-badge .emoji { font-size: 1rem; }
        .turn-badge .img { width: 22px; height: 22px; border-radius: 3px; object-fit: cover; transform: scaleX(-1); }
        .scores { font-size: 0.7rem; color: var(--text-dim); display: flex; gap: 8px; align-items: center; }
        .scores .v { font-weight: 600; color: var(--text); }
        .scores .emoji { font-size: 0.85rem; }
        .scores .img { width: 18px; height: 18px; border-radius: 3px; object-fit: cover; transform: scaleX(-1); }

        .board-wrap { position: relative; width: min(88vw, 55vh); height: min(88vw, 55vh); }
        .board { display: grid; grid-template-columns: repeat(3,1fr); grid-template-rows: repeat(3,1fr); gap: 1px; background: var(--border); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; width: 100%; height: 100%; }
        .cell { background: var(--bg); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: background 0.12s; -webkit-tap-highlight-color: transparent; overflow: hidden; }
        .cell:hover:not(.m) { background: var(--surface); }
        .cell.m { cursor: default; }
        .cell .ce { font-size: 2.2rem; opacity: 0; transform: scale(0.6); transition: opacity 0.15s, transform 0.15s; font-weight: 200; }
        .cell.m .ce { opacity: 1; transform: scale(1); }
        .cell img { width: 80%; height: 80%; object-fit: cover; border-radius: 4px; opacity: 0; transform: scale(0.6) scaleX(-1); transition: opacity 0.15s, transform 0.15s; }
        .cell.m img { opacity: 1; transform: scale(1) scaleX(-1); }
        .cell.win { animation: wp 0.5s ease-in-out infinite alternate; }
        @keyframes wp { from { transform: scale(1); } to { transform: scale(1.02); } }

        #win-canvas { position: absolute; top:0; left:0; width:100%; height:100%; pointer-events: none; z-index: 5; }
        .not-turn { position: absolute; inset:0; background: rgba(250,250,250,0.65); display: flex; align-items: center; justify-content: center; font-size: 0.75rem; color: var(--text-dim); border-radius: 6px; pointer-events: none; opacity: 0; transition: opacity 0.15s; }
        .not-turn.show { opacity: 1; }

        .ctrls { display: flex; gap: 6px; margin-top: 8px; }

        .result-overlay { position: fixed; inset:0; background: rgba(250,250,250,0.92); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 200; opacity: 0; pointer-events: none; transition: opacity 0.2s; backdrop-filter: blur(6px); }
        .result-overlay.show { opacity: 1; pointer-events: all; }
        .result-overlay h2 { font-size: 1.3rem; font-weight: 300; letter-spacing: 0.15em; margin-bottom: 8px; }
        .result-overlay .big { font-size: 3.5rem; margin-bottom: 10px; }
        .result-overlay .big img { width: 90px; height: 90px; border-radius: 8px; object-fit: cover; transform: scaleX(-1); }

        #confetti-canvas { position: fixed; top:0; left:0; width:100%; height:100%; pointer-events: none; z-index: 150; }
    </style>
</head>
<body>

    <!-- PICKER -->
    <div class="screen" id="picker">
        <h1>過三關</h1>
        <div class="pick-section">
            <div class="pick-header active" id="pick-header">Player 1 — pick your emoji</div>
            <div class="emoji-grid" id="emoji-grid"></div>
        </div>
        <button class="snap-btn" id="snap-btn">📸 Take photo instead</button>
        <div class="camera-preview" id="camera-preview" style="position:relative;">
            <video id="snap-video" playsinline autoplay></video>
            <div class="cam-label">Camera</div>
        </div>
        <canvas id="snap-canvas" class="snap-hidden"></canvas>
        <div class="pick-preview">
            <div class="pick-card">
                <div class="label">P1</div>
                <div class="box empty" id="p1-box">?</div>
            </div>
            <div style="font-size:0.6rem; color:var(--text-dim);">vs</div>
            <div class="pick-card">
                <div class="label">P2</div>
                <div class="box empty" id="p2-box">?</div>
            </div>
        </div>
        <div class="online-link" id="go-online">Play with a friend online →</div>
    </div>

    <!-- ONLINE -->
    <div class="screen hidden" id="online-screen">
        <h1>過三關</h1>
        <div class="online-tabs">
            <button class="active" data-role="create">Create Room</button>
            <button data-role="join">Join Room</button>
        </div>

        <div id="create-area" style="display:flex; flex-direction:column; align-items:center; gap:10px; width:100%;">
            <div class="pick-section">
                <div class="pick-header active">Pick your emoji</div>
                <div class="emoji-grid" id="online-emoji-grid"></div>
            </div>
            <button class="btn" id="create-btn">Create Room</button>
        </div>

        <div id="join-area" style="display:none; flex-direction:column; align-items:center; gap:10px; width:100%;">
            <div class="join-input">
                <input type="text" id="room-code-input" maxlength="6" placeholder="ABC123" autocomplete="off">
            </div>
            <div class="pick-section">
                <div class="pick-header active">Pick your emoji</div>
                <div class="emoji-grid" id="join-emoji-grid"></div>
            </div>
            <button class="btn" id="join-btn" disabled>Join Room</button>
        </div>

        <div class="error-msg hidden" id="online-error"></div>
        <div class="online-link" id="go-local">← Back to local play</div>
    </div>

    <!-- WAITING -->
    <div class="screen hidden" id="waiting-screen">
        <h1>過三關</h1>
        <div class="room-box">
            <div style="font-size:0.55rem; color:var(--text-dim); letter-spacing:0.1em;">Room Code</div>
            <div class="room-code" id="room-code-display">------</div>
            <div class="share-url" id="share-url" title="Click to copy"></div>
        </div>
        <div class="waiting"><div class="spinner"></div><span>Waiting for Player 2…</span></div>
        <button class="btn btn-sm" id="cancel-btn">Cancel</button>
    </div>

    <!-- GAME -->
    <div class="screen hidden" id="game-screen">
        <h1>過三關</h1>
        <div class="info-bar">
            <div class="turn-badge" id="turn-badge"><span id="turn-vis"></span><span id="turn-txt"></span></div>
            <div class="scores" id="scores-bar"></div>
        </div>
        <div class="board-wrap" id="board-wrap">
            <div class="board" id="board"></div>
            <canvas id="win-canvas"></canvas>
            <div class="not-turn" id="not-turn">Not your turn</div>
        </div>
        <div class="ctrls">
            <button class="btn btn-sm" id="btn-restart">Restart</button>
            <button class="btn btn-sm" id="btn-leave">Leave</button>
        </div>
    </div>

    <canvas id="confetti-canvas"></canvas>

    <div class="result-overlay" id="result-overlay">
        <div class="big" id="result-big"></div>
        <h2 id="result-text"></h2>
        <div style="margin-top:12px;">
            <button class="btn btn-sm" id="leave-btn">Leave</button>
        </div>
    </div>

    <script>
    (() => {
        firebase.initializeApp({
            apiKey: "AIzaSyDLfe9pFWxU0K-BXKeSPXXMd3fwMEvGelw",
            authDomain: "tic-tac-toe-dd488.firebaseapp.com",
            databaseURL: "https://tic-tac-toe-dd488-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "tic-tac-toe-dd488",
            storageBucket: "tic-tac-toe-dd488.firebasestorage.app",
            messagingSenderId: "366226840426",
            appId: "1:366226840426:web:32f9a7ab26cb4fa0466313"
        });
        const db = firebase.database();

        const EMOJIS = ['😀','😂','😎','🥳','🤩','😏','🐱','🐶','🦊','🐸','🐻','🐼','🌟','🔥','⚡','❄️','🌈','💎','🍕','🌮','🚀','🎮','🎲','💀'];
        const WIN_LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

        let picks = [null, null]; // [p1, p2]
        let pickStep = 0;
        let photos = [null, null];
        let emojis = [null, null];
        let isOnline = false;
        let roomCode = null, playerIndex = null, roomRef = null;
        let gameListener = null, joinListener = null, onlineStarted = false;
        let onlinePickData = { emoji: null, photo: null };
        const state = { board: Array(9).fill(null), turn: 0, gameOver: false, scores: [0,0,0] };

        const $ = id => document.getElementById(id);
        const boardEl = $('board'), boardWrap = $('board-wrap');
        const turnVis = $('turn-vis'), turnTxt = $('turn-txt'), scoresBar = $('scores-bar');
        const notTurn = $('not-turn');
        const resultOverlay = $('result-overlay'), resultBig = $('result-big'), resultText = $('result-text');
        const confettiCanvas = $('confetti-canvas'), confettiCtx = confettiCanvas.getContext('2d');
        const winCanvas = $('win-canvas'), winCtx = winCanvas.getContext('2d');
        const cells = [];

        // Sound
        const ax = new (window.AudioContext || window.webkitAudioContext)();
        function snd(f,d,t='sine',v=0.08) { try{const o=ax.createOscillator(),g=ax.createGain();o.type=t;o.frequency.value=f;g.gain.setValueAtTime(v,ax.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ax.currentTime+d);o.connect(g);g.connect(ax.destination);o.start();o.stop(ax.currentTime+d);}catch(e){} }
        function sndPlace() { snd(800,0.06); }
        function sndWin() { snd(523,0.12);setTimeout(()=>snd(659,0.12),80);setTimeout(()=>snd(784,0.25),160); }
        function sndDraw() { snd(300,0.25,'triangle',0.05); }

        // Helpers
        function visFor(i) { if(photos[i]) return `<img class="img" src="${photos[i]}" alt="">`; if(emojis[i]) return `<span class="emoji">${emojis[i]}</span>`; return '?'; }
        function scoreFor(i) { if(photos[i]) return `<img class="img" src="${photos[i]}" alt=""> <span class="v">${state.scores[i]}</span>`; if(emojis[i]) return `<span class="emoji">${emojis[i]}</span> <span class="v">${state.scores[i]}</span>`; return '?'; }
        function hasPhoto(i) { return photos[i]!==null; }
        function hasEmoji(i) { return emojis[i]!==null; }
        function genCode() { return Math.random().toString(36).substring(2,8).toUpperCase(); }

        function resizeConfetti() { confettiCanvas.width=innerWidth; confettiCanvas.height=innerHeight; }
        addEventListener('resize',resizeConfetti); resizeConfetti();

        // ===== LOCAL PICKER =====
        function buildGrid(gridId, onPick) {
            const grid = $(gridId); grid.innerHTML = '';
            EMOJIS.forEach(e => {
                const btn = document.createElement('button');
                btn.className = 'e'; btn.textContent = e;
                btn.addEventListener('click', () => onPick(e, btn));
                grid.appendChild(btn);
            });
        }

        function updatePickerUI() {
            // Update preview boxes
            [0,1].forEach(i => {
                const box = $(i===0?'p1-box':'p2-box');
                if (photos[i]) {
                    box.innerHTML = `<img src="${photos[i]}" style="width:100%;height:100%;object-fit:cover;border-radius:2px;transform:scaleX(-1);" alt="">`;
                    box.className = 'box filled';
                } else if (picks[i]) {
                    box.textContent = picks[i];
                    box.className = 'box filled';
                } else {
                    box.textContent = '?';
                    box.className = 'box empty';
                }
            });

            // Mark used emojis
            document.querySelectorAll('#emoji-grid .e').forEach(btn => {
                btn.classList.toggle('sel', btn.textContent === picks[0] || btn.textContent === picks[1]);
                btn.classList.toggle('used', (picks[0] && btn.textContent === picks[0] && pickStep === 1) || (picks[1] && btn.textContent === picks[1] && pickStep === 0));
            });

            if (pickStep === 0) {
                $('pick-header').textContent = 'Player 1 — pick your emoji';
                $('pick-header').className = 'pick-header active';
            } else if (!picks[1]) {
                $('pick-header').textContent = 'Player 2 — pick your emoji';
                $('pick-header').className = 'pick-header active';
            } else {
                $('pick-header').textContent = 'Starting…';
                $('pick-header').className = 'pick-header';
            }
        }

        buildGrid('emoji-grid', (e) => {
            picks[pickStep] = e;
            emojis[pickStep] = e;
            photos[pickStep] = null;
            updatePickerUI();
            if (pickStep === 0) {
                pickStep = 1;
                setTimeout(updatePickerUI, 300);
            } else {
                // Both picked — auto-start after brief delay
                setTimeout(() => {
                    isOnline = false;
                    playerIndex = null;
                    $('picker').classList.add('hidden');
                    $('game-screen').classList.remove('hidden');
                    resetBoard();
                    resizeConfetti();
                }, 500);
            }
        });

        updatePickerUI();

        // Camera snap
        let snapStream = null;
        $('snap-btn').addEventListener('click', async () => {
            const btn = $('snap-btn');
            btn.textContent = 'Opening camera…';
            btn.disabled = true;
            const preview = $('camera-preview');
            const video = $('snap-video');
            try {
                snapStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 320 }, height: { ideal: 320 } } });
                video.srcObject = snapStream;
                // Wait until camera is actually playing
                await new Promise((resolve, reject) => {
                    video.onplaying = resolve;
                    video.onerror = reject;
                    setTimeout(reject, 5000); // 5s timeout
                });
                // Camera is ready — show preview
                preview.style.display = 'block';
                btn.textContent = '📸 Capturing…';
                // Wait a bit for camera to stabilise
                await new Promise(r => setTimeout(r, 1000));
                // Capture
                const vw = video.videoWidth, vh = video.videoHeight, s = Math.min(vw, vh);
                const canvas = $('snap-canvas');
                canvas.width = 64; canvas.height = 64;
                canvas.getContext('2d').drawImage(video, (vw-s)/2, (vh-s)/2, s, s, 0, 0, 64, 64);
                const photo = canvas.toDataURL('image/jpeg', 0.6);
                // Stop camera
                snapStream.getTracks().forEach(t => t.stop());
                snapStream = null;
                preview.style.display = 'none';
                // Set as player's photo
                photos[pickStep] = photo;
                emojis[pickStep] = null;
                picks[pickStep] = '📸';
                updatePickerUI();
                // Show photo in preview
                const box = $(pickStep === 0 ? 'p1-box' : 'p2-box');
                box.innerHTML = `<img src="${photo}" style="width:100%;height:100%;object-fit:cover;border-radius:2px;transform:scaleX(-1);" alt="">`;
                box.className = 'box filled';
                // Advance
                if (pickStep === 0) {
                    pickStep = 1;
                    btn.textContent = '📸 Take photo';
                    btn.disabled = false;
                    setTimeout(updatePickerUI, 300);
                } else {
                    setTimeout(() => {
                        isOnline = false; playerIndex = null;
                        $('picker').classList.add('hidden');
                        $('game-screen').classList.remove('hidden');
                        resetBoard(); resizeConfetti();
                    }, 500);
                }
            } catch (e) {
                console.error('Camera error:', e);
                preview.style.display = 'none';
                if (snapStream) { snapStream.getTracks().forEach(t => t.stop()); snapStream = null; }
                if (e.name === 'NotAllowedError') {
                    btn.textContent = '📸 Camera blocked — allow in Chrome settings';
                } else if (e.name === 'NotFoundError') {
                    btn.textContent = '📸 No camera found';
                } else {
                    btn.textContent = '📸 Camera error — try again';
                }
                setTimeout(() => { btn.textContent = '📸 Take photo instead'; btn.disabled = false; }, 3000);
            }
        });

        // Online link
        $('go-online').addEventListener('click', () => {
            $('picker').classList.add('hidden');
            $('online-screen').classList.remove('hidden');
            buildOnlineGrids();
        });

        $('go-local').addEventListener('click', () => {
            $('online-screen').classList.add('hidden');
            $('picker').classList.remove('hidden');
            picks = [null, null]; emojis = [null, null]; photos = [null, null]; pickStep = 0;
            updatePickerUI();
        });

        // ===== ONLINE =====
        function buildOnlineGrids() {
            buildGrid('online-emoji-grid', (e, btn) => {
                document.querySelectorAll('#online-emoji-grid .e').forEach(b=>b.classList.remove('sel'));
                btn.classList.add('sel');
                onlinePickData = { emoji: e, photo: null };
                $('create-btn').disabled = false;
            });
            buildGrid('join-emoji-grid', (e, btn) => {
                document.querySelectorAll('#join-emoji-grid .e').forEach(b=>b.classList.remove('sel'));
                btn.classList.add('sel');
                onlinePickData = { emoji: e, photo: null };
                updateJoinBtn();
            });
        }

        // Online tabs
        document.querySelectorAll('.online-tabs button').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.online-tabs button').forEach(b=>b.classList.remove('active'));
                btn.classList.add('active');
                $('create-area').style.display = btn.dataset.role==='create'?'flex':'none';
                $('join-area').style.display = btn.dataset.role==='join'?'flex':'none';
            });
        });

        function updateJoinBtn() {
            const codeOk = $('room-code-input').value.trim().length >= 4;
            $('join-btn').disabled = !codeOk;
        }

        $('room-code-input').addEventListener('input', e => {
            e.target.value = e.target.value.toUpperCase();
            updateJoinBtn();
        });

        // Create room
        $('create-btn').addEventListener('click', () => {
            const btn=$('create-btn'); btn.textContent='Creating…'; btn.disabled=true;
            isOnline=true; onlineStarted=false;
            roomCode = genCode(); playerIndex=0;
            const myEmoji = onlinePickData.emoji || EMOJIS[Math.floor(Math.random() * EMOJIS.length)];
            emojis=[myEmoji,null]; photos=[null,null];
            roomRef = db.ref('rooms/'+roomCode);

            // Set onDisconnect first, before write
            roomRef.onDisconnect().remove();

            roomRef.set({
                players:{0:{emoji:myEmoji,photo:null},1:null},
                board:Array(9).fill(null),turn:0,scores:[0,0,0],gameOver:false,created:Date.now()
            }).then(() => {
                // Listen for player 2 joining
                joinListener = roomRef.child('players/1').on('value', snap => {
                    const p2=snap.val();
                    if(p2 && !onlineStarted) {
                        onlineStarted=true;
                        if(p2.photo){photos[1]=p2.photo;emojis[1]=null;}else{emojis[1]=p2.emoji;photos[1]=null;}
                        roomRef.child('players/1').off('value',joinListener); joinListener=null;
                        startOnlineGame();
                    }
                });

                $('online-screen').classList.add('hidden');
                $('waiting-screen').classList.remove('hidden');
                $('room-code-display').textContent=roomCode;
                $('share-url').textContent=location.origin+location.pathname+'?room='+roomCode;
            }).catch(err => {
                console.error('Create failed:', err);
                $('online-error').textContent='Failed: '+err.message;
                $('online-error').classList.remove('hidden');
                btn.textContent='Create Room'; btn.disabled=false;
                isOnline = false;
            });
        });

        $('share-url').addEventListener('click', () => {
            const url=$('share-url').textContent;
            navigator.clipboard.writeText(url);
            $('share-url').textContent='✓ Copied!';
            setTimeout(()=>{ $('share-url').textContent=url; },1200);
        });

        $('cancel-btn').addEventListener('click', () => {
            if(joinListener && roomRef){roomRef.child('players/1').off('value',joinListener);joinListener=null;}
            if(roomRef){roomRef.onDisconnect().cancel();roomRef.remove().catch(()=>{});}
            roomRef=null; roomCode=null;
            $('waiting-screen').classList.add('hidden');
            $('online-screen').classList.remove('hidden');
            $('create-btn').textContent='Create Room'; $('create-btn').disabled=true;
        });

        // Join room
        $('join-btn').addEventListener('click', () => {
            const btn=$('join-btn'); btn.textContent='Joining…'; btn.disabled=true;
            const code=$('room-code-input').value.trim();
            $('online-error').classList.add('hidden');
            const myEmoji = onlinePickData.emoji || EMOJIS[Math.floor(Math.random() * EMOJIS.length)];

            db.ref('rooms/'+code).once('value').then(snap => {
                if (!snap.exists()) {
                    $('online-error').textContent='Room not found. Check the code.';
                    $('online-error').classList.remove('hidden');
                    btn.textContent='Join Room'; btn.disabled=false;
                    return null;
                }

                const data = snap.val();
                if (!data || !data.players || !data.players[0]) {
                    $('online-error').textContent='Invalid room.';
                    $('online-error').classList.remove('hidden');
                    btn.textContent='Join Room'; btn.disabled=false;
                    return null;
                }

                isOnline = true;
                roomCode = code;
                playerIndex = 1;
                roomRef = db.ref('rooms/' + roomCode);
                emojis = [null, myEmoji];
                photos = [null, null];

                // Read host data
                if (data.players[0].emoji) emojis[0] = data.players[0].emoji;
                if (data.players[0].photo) photos[0] = data.players[0].photo;

                // Write player 2 data
                return roomRef.child('players/1').set({
                    emoji: myEmoji, photo: null
                }).then(() => {
                    roomRef.child('players/1').onDisconnect().remove();
                    startOnlineGame();
                });
            }).catch(err => {
                console.error('Join failed:', err);
                $('online-error').textContent='Failed: ' + err.message;
                $('online-error').classList.remove('hidden');
                btn.textContent='Join Room'; btn.disabled=false;
                isOnline = false;
            });
        });

        // Start online game
        function startOnlineGame() {
            $('online-screen').classList.add('hidden');
            $('waiting-screen').classList.add('hidden');
            $('game-screen').classList.remove('hidden');
            resetBoard(); resizeConfetti();

            if(gameListener && roomRef) roomRef.off('value',gameListener);

            roomRef.child(`players/${1-playerIndex}`).on('value', snap => {
                if(!snap.exists()&&!state.gameOver&&onlineStarted){
                    state.gameOver=true;
                    resultBig.textContent='👋';
                    resultText.textContent='Opponent left';
                    resultOverlay.classList.add('show');
                }
            });

            gameListener = roomRef.on('value', snap => {
                const d=snap.val();
                if(!d){if(!state.gameOver)setTimeout(()=>leaveGame(),1500);return;}
                const rb=d.board, nb=Array(9).fill(null);
                if(rb&&typeof rb==='object'){for(let i=0;i<9;i++)if(rb[i]!=null)nb[i]=rb[i];}
                state.board=nb; state.turn=d.turn!=null?d.turn:0;
                const rs=d.scores; state.scores=[0,0,0];
                if(rs&&typeof rs==='object'){if(rs[0]!=null)state.scores[0]=rs[0];if(rs[1]!=null)state.scores[1]=rs[1];if(rs[2]!=null)state.scores[2]=rs[2];}
                if(d.players&&d.players[0]){if(d.players[0].emoji)emojis[0]=d.players[0].emoji;if(d.players[0].photo)photos[0]=d.players[0].photo;}
                if(d.players&&d.players[1]){if(d.players[1].emoji)emojis[1]=d.players[1].emoji;if(d.players[1].photo)photos[1]=d.players[1].photo;}
                renderBoard(); updateTurn(); updateScores();
                if(playerIndex!==null&&state.turn!==playerIndex&&!state.gameOver){notTurn.classList.add('show');}else{notTurn.classList.remove('show');}
                if(d.gameOver&&!state.gameOver){
                    state.gameOver=true;
                    let w=null,wl=null;
                    for(const[a,b,c]of WIN_LINES){if(state.board[a]!==null&&state.board[a]===state.board[b]&&state.board[a]===state.board[c]){w=state.board[a];wl=[a,b,c];break;}}
                    if(w!==null){wl.forEach(i=>cells[i].classList.add('win'));drawWinLine(wl);sndWin();if(navigator.vibrate)navigator.vibrate([50,30,50]);
                        resultBig.innerHTML=hasPhoto(w)?`<img src="${photos[w]}" alt="">`:`<span style="font-size:3.5rem">${emojis[w]}</span>`;
                        resultText.textContent=`Player ${w+1} wins`;
                    }else{sndDraw();resultBig.textContent='🤝';resultText.textContent='Draw';}
                    launchConfetti();setTimeout(()=>resultOverlay.classList.add('show'),w!==null?600:300);
                    setTimeout(()=>{resultOverlay.classList.remove('show');clearWinLine();state.gameOver=false;
                        if(roomRef)roomRef.update({board:Array(9).fill(null),turn:0,gameOver:false}).catch(()=>{});
                        resetBoard();},4000);
                }
            });
        }

        // ===== BOARD =====
        function resetBoard() {
            state.board=Array(9).fill(null);state.turn=0;state.gameOver=false;lastWinLine=null;
            boardEl.innerHTML='';cells.length=0;
            for(let i=0;i<9;i++){
                const cell=document.createElement('div');cell.className='cell';
                const img=document.createElement('img');img.alt='';img.style.display='none';
                const ce=document.createElement('span');ce.className='ce';ce.style.display='none';
                cell.appendChild(img);cell.appendChild(ce);
                cell.addEventListener('click',()=>handleClick(i));
                boardEl.appendChild(cell);cells.push(cell);
            }
            resultOverlay.classList.remove('show');clearWinLine();renderBoard();updateTurn();updateScores();
        }

        function renderBoard() {
            cells.forEach((cell,i)=>{
                const v=state.board[i],img=cell.querySelector('img'),ce=cell.querySelector('.ce');
                if(v!==null){
                    cell.classList.add('m');
                    if(hasPhoto(v)){img.src=photos[v];img.style.display='';img.style.opacity='1';img.style.transform='scale(1) scaleX(-1)';ce.style.display='none';}
                    else if(hasEmoji(v)){ce.textContent=emojis[v];ce.style.display='';ce.style.opacity='1';ce.style.transform='scale(1)';img.style.display='none';}
                }else{cell.classList.remove('m','win');img.style.display='none';ce.style.display='none';}
            });
        }

        function updateTurn(){turnVis.innerHTML=visFor(state.turn);turnTxt.textContent=`P${state.turn+1}`;scoresBar.innerHTML=`${scoreFor(0)} · Draw <span class="v">${state.scores[2]}</span> · ${scoreFor(1)}`;}
        function updateScores(){scoresBar.innerHTML=`${scoreFor(0)} · Draw <span class="v">${state.scores[2]}</span> · ${scoreFor(1)}`;}

        function handleClick(i) {
            if(state.gameOver||state.board[i]!==null)return;
            if(playerIndex!==null&&state.turn!==playerIndex)return;
            const cur=state.turn; state.board[i]=cur; sndPlace();
            if(navigator.vibrate)navigator.vibrate(10);
            let w=null,wl=null;
            for(const[a,b,c]of WIN_LINES){if(state.board[a]!==null&&state.board[a]===state.board[b]&&state.board[a]===state.board[c]){w=state.board[a];wl=[a,b,c];break;}}
            const draw=w===null&&state.board.every(c=>c!==null);
            if(roomRef){
                const nt=(w!==null||draw)?cur:1-cur;
                const ns=[...state.scores];
                if(w!==null)ns[w]++;else if(draw)ns[2]++;
                roomRef.update({board:state.board,turn:nt,scores:ns,gameOver:w!==null||draw}).catch(()=>{});
                state.scores=ns;renderBoard();
                if(w!==null)endGame(w,wl);else if(draw)endGame(null);else{state.turn=1-cur;updateTurn();}
            }else{
                renderBoard();
                if(w!==null)endGame(w,wl);else if(draw)endGame(null);else{state.turn=1-cur;updateTurn();}
            }
        }

        let lastWinLine=null;
        function endGame(w,wl) {
            state.gameOver=true;lastWinLine=wl;
            if(w!==null&&wl){wl.forEach(i=>cells[i].classList.add('win'));drawWinLine(wl);sndWin();if(navigator.vibrate)navigator.vibrate([50,30,50]);
                resultBig.innerHTML=hasPhoto(w)?`<img src="${photos[w]}" alt="">`:`<span style="font-size:3.5rem">${emojis[w]}</span>`;
                resultText.textContent=`Player ${w+1} wins`;
            }else{sndDraw();resultBig.textContent='🤝';resultText.textContent='Draw';}
            updateScores();launchConfetti();
            setTimeout(()=>resultOverlay.classList.add('show'),w!==null?600:300);
            if(!isOnline)setTimeout(()=>{resultOverlay.classList.remove('show');clearWinLine();state.gameOver=false;resetBoard();},4000);
        }

        // Win line
        function drawWinLine(wl) {
            const rect=boardWrap.getBoundingClientRect(),dpr=devicePixelRatio||1;
            winCanvas.width=rect.width*dpr;winCanvas.height=rect.height*dpr;
            winCanvas.style.width=rect.width+'px';winCanvas.style.height=rect.height+'px';
            winCtx.scale(dpr,dpr);
            const cw=rect.width/3,ch=rect.height/3;
            const[a,,c]=wl;
            const x1=(a%3)*cw+cw/2,y1=Math.floor(a/3)*ch+ch/2,x2=(c%3)*cw+cw/2,y2=Math.floor(c/3)*ch+ch/2;
            const t=performance.now();
            function anim(n){const p=Math.min((n-t)/350,1),e=1-Math.pow(1-p,3);
                winCtx.clearRect(0,0,rect.width,rect.height);
                winCtx.beginPath();winCtx.moveTo(x1,y1);winCtx.lineTo(x1+(x2-x1)*e,y1+(y2-y1)*e);
                winCtx.strokeStyle='#1a1a1a';winCtx.lineWidth=4;winCtx.lineCap='round';winCtx.stroke();
                if(p<1)requestAnimationFrame(anim);}
            requestAnimationFrame(anim);
        }
        function clearWinLine(){winCtx.clearRect(0,0,winCanvas.width,winCanvas.height);}
        addEventListener('resize',()=>{if(lastWinLine&&state.gameOver)drawWinLine(lastWinLine);});

        // Restart / Leave
        $('btn-restart').addEventListener('click',()=>{
            if(roomRef){state.scores=[0,0,0];roomRef.update({board:Array(9).fill(null),turn:0,scores:[0,0,0],gameOver:false}).catch(()=>{});}
            lastWinLine=null;state.gameOver=false;resultOverlay.classList.remove('show');resetBoard();
        });

        function leaveGame() {
            if(joinListener&&roomRef){roomRef.child('players/1').off('value',joinListener);joinListener=null;}
            if(gameListener&&roomRef){roomRef.off('value',gameListener);gameListener=null;}
            if(roomRef&&playerIndex!==null)roomRef.child(`players/${1-playerIndex}`).off();
            if(roomRef){if(playerIndex===0){roomRef.onDisconnect().cancel();roomRef.remove().catch(()=>{});}}
            roomRef=null;roomCode=null;playerIndex=null;onlineStarted=false;isOnline=false;
            $('game-screen').classList.add('hidden');$('waiting-screen').classList.add('hidden');
            $('online-screen').classList.add('hidden');
            resultOverlay.classList.remove('show');$('picker').classList.remove('hidden');
            picks=[null,null];emojis=[null,null];photos=[null,null];pickStep=0;
            updatePickerUI();
        }
        $('leave-btn').addEventListener('click',leaveGame);
        $('btn-leave').addEventListener('click',leaveGame);

        // Confetti
        let cp=[],cr=false;
        function launchConfetti(){cp=[];const cols=['#1a1a1a','#999','#bbb','#d0d0d0','#666','#ccc'];
            for(let i=0;i<50;i++)cp.push({x:Math.random()*confettiCanvas.width,y:-10-Math.random()*60,w:4+Math.random()*4,h:3+Math.random()*3,vx:(Math.random()-0.5)*3,vy:2+Math.random()*3,color:cols[Math.floor(Math.random()*cols.length)],rot:Math.random()*360,rv:(Math.random()-0.5)*8,life:1});
            if(!cr){cr=true;animC();}}
        function animC(){confettiCtx.clearRect(0,0,confettiCanvas.width,confettiCanvas.height);cp=cp.filter(p=>p.life>0);
            cp.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.08;p.rot+=p.rv;p.life-=0.005;
                confettiCtx.save();confettiCtx.translate(p.x,p.y);confettiCtx.rotate(p.rot*Math.PI/180);confettiCtx.globalAlpha=p.life;confettiCtx.fillStyle=p.color;confettiCtx.fillRect(-p.w/2,-p.h/2,p.w,p.h);confettiCtx.restore();});
            if(cp.length)requestAnimationFrame(animC);else cr=false;}

        // Auto-join
        const up=new URLSearchParams(location.search);
        const ajc=up.get('room');
        if(ajc){
            $('picker').classList.add('hidden');
            $('online-screen').classList.remove('hidden');
            document.querySelectorAll('.online-tabs button').forEach(b=>b.classList.remove('active'));
            document.querySelector('[data-role="join"]').classList.add('active');
            $('create-area').style.display='none';
            $('join-area').style.display='flex';
            $('room-code-input').value=ajc.toUpperCase();
            buildOnlineGrids();
            updateJoinBtn();
        }
    })();
    </script>
</body>
</html>
